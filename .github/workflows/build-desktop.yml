name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checks
        run: npm run typecheck

  package:
    name: Package ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            command: npm run dist --workspace @brainbuddy/desktop -- --linux AppImage --x64
            artifact: brainbuddy-linux-x64
            files: apps/desktop/release/*.AppImage
          - name: Windows x64
            runner: windows-2025
            command: npm run dist --workspace @brainbuddy/desktop -- --win nsis portable --x64
            artifact: brainbuddy-windows-x64
            files: apps/desktop/release/*.exe
          - name: macOS Apple Silicon
            runner: macos-15
            command: npm run dist --workspace @brainbuddy/desktop -- --mac dmg zip --arm64 -c.mac.identity=-
            artifact: brainbuddy-macos-arm64
            app: apps/desktop/release/mac-arm64/brainbuddy.app
            executable: apps/desktop/release/mac-arm64/brainbuddy.app/Contents/MacOS/brainbuddy
            architecture: arm64
            files: |-
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              docs/macos-unsigned-build.md
          - name: macOS Intel
            runner: macos-15-intel
            command: npm run dist --workspace @brainbuddy/desktop -- --mac dmg zip --x64 -c.mac.identity=-
            artifact: brainbuddy-macos-x64
            app: apps/desktop/release/mac/brainbuddy.app
            executable: apps/desktop/release/mac/brainbuddy.app/Contents/MacOS/brainbuddy
            architecture: x86_64
            files: |-
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              docs/macos-unsigned-build.md
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: ${{ matrix.command }}

      - name: Smoke test packaged Linux renderer
        if: runner.os == 'Linux'
        shell: bash
        run: |-
          set -euo pipefail
          export XDG_CONFIG_HOME="${RUNNER_TEMP}/brainbuddy-smoke-profile"
          mkdir -p "$XDG_CONFIG_HOME"
          xvfb-run -a apps/desktop/release/linux-unpacked/brainbuddy \
            --no-sandbox \
            --remote-debugging-port=19222 \
            > "${RUNNER_TEMP}/brainbuddy-smoke.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            targets=$(curl -fsS http://127.0.0.1:19222/json/list 2>/dev/null || true)
            if printf "%s" "$targets" | grep -q "BrainBuddy Privacy Lab"; then
              echo "Packaged renderer is ready"
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "${RUNNER_TEMP}/brainbuddy-smoke.log"
              exit 1
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/brainbuddy-smoke.log"
          exit 1

      - name: Verify macOS application signature and architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |-
          codesign --verify --deep --strict --verbose=2 "${{ matrix.app }}"
          codesign --display --verbose=4 "${{ matrix.app }}"
          lipo -archs "${{ matrix.executable }}" | grep -qw "${{ matrix.architecture }}"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
